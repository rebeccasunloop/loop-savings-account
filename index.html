  --color-green-800:oklch(44.8% 0.119 151.328);
  --color-green-900:oklch(39.3% 0.095 152.535);
  --color-green-950:oklch(26.6% 0.065 152.934);

  --color-red-50:oklch(97.1% 0.013 17.38);

  --color-red-200:oklch(88.5% 0.062 18.334);
  --color-red-300:oklch(80.8% 0.114 19.571);
  --color-red-400:oklch(70.4% 0.191 22.216);

  --color-red-900:oklch(39.6% 0.141 25.723);
  --color-red-950:oklch(25.8% 0.092 26.042);

  /* brand ramp (theme.css) */
  --color-brand-50:oklch(from var(--loop-green) clamp(0,calc(l + 0.5),1) c h);
  --color-brand-100:oklch(from var(--loop-green) clamp(0,calc(l + 0.4),1) c h);
  --color-brand-200:oklch(from var(--loop-green) clamp(0,calc(l + 0.3),1) c h);
  --color-brand-300:oklch(from var(--loop-green) clamp(0,calc(l + 0.2),1) c h);
  --color-brand-400:oklch(from var(--loop-green) clamp(0,calc(l + 0.1),1) c h);
  --color-brand-500:var(--loop-green);
  --color-brand-600:oklch(from var(--loop-green) clamp(0,calc(l - 0.1),1) c h);
  --color-brand-700:oklch(from var(--loop-green) clamp(0,calc(l - 0.2),1) c h);
  --color-brand-800:oklch(from var(--loop-green) clamp(0,calc(l - 0.3),1) c h);
  --color-brand-900:oklch(from var(--loop-green) clamp(0,calc(l - 0.4),1) c h);

  /* type */
  --font-body:'Articulat CF',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --text-xs:.75rem;   --text-xs-lh:1.125rem;
  --text-sm:.875rem;  --text-sm-lh:1.25rem;
  --text-md:1rem;     --text-md-lh:1.5rem;
  --text-lg:1.125rem; --text-lg-lh:1.75rem;
  --text-xl:1.25rem;  --text-xl-lh:1.875rem;
  --text-display-xs:1.5rem;   --text-display-xs-lh:2rem;
  --text-display-sm:1.875rem; --text-display-sm-lh:2.375rem;

  /* radius — Loop scale, 1.25rem default */
  --radius-xs:calc(1.25rem - 6px);
  --radius-sm:calc(1.25rem - 4px);
  --radius-md:calc(1.25rem - 2px);
  --radius-lg:1.25rem;
  --radius-xl:calc(1.25rem + 4px);
  --radius-2xl:calc(1.25rem + 6px);
  --radius-full:9999px;

  /* shadow */
  --shadow-xs:0px 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0px 1px 3px rgba(0,0,0,.1),0px 1px 2px -1px rgba(0,0,0,.1);
  --shadow-lg:0px 12px 16px -4px rgba(0,0,0,.08),0px 4px 6px -2px rgba(0,0,0,.03),0px 2px 2px -1px rgba(0,0,0,.04);
  --shadow-xl:0px 20px 24px -4px rgba(0,0,0,.08),0px 8px 8px -4px rgba(0,0,0,.03),0px 3px 3px -1.5px rgba(0,0,0,.04);
  --shadow-2xl:0px 24px 48px -12px rgba(0,0,0,.18),0px 4px 4px -2px rgba(0,0,0,.04);
  --shadow-skeuomorphic:0px 0px 0px 1px rgba(0,0,0,.18) inset,0px -2px 0px 0px rgba(0,0,0,.05) inset;
  --shadow-xs-skeuomorphic:var(--shadow-skeuomorphic),var(--shadow-xs);

  /* semantic — light */
  --color-text-primary:var(--color-neutral-900);
  --color-text-secondary:var(--color-neutral-700);
  --color-text-tertiary:var(--color-neutral-600);
  --color-text-quaternary:var(--color-neutral-500);
  --color-text-placeholder:var(--color-neutral-500);
  --color-fg-primary:var(--color-neutral-900);
  --color-fg-quaternary:var(--color-neutral-400);
  --color-fg-brand-primary:var(--color-brand-600);
  --color-bg-primary:var(--white);
  --color-bg-primary_hover:var(--color-neutral-50);
  --color-bg-secondary:var(--color-neutral-50);
  --color-bg-secondary_hover:var(--color-neutral-100);
  --color-bg-tertiary:var(--color-neutral-100);
  --color-bg-quaternary:var(--color-neutral-200);
  --color-bg-brand-primary:var(--color-brand-500);
  --color-bg-brand-secondary:var(--loop-light-green);
  --color-bg-brand-solid:var(--color-brand-600);
  --color-bg-brand-solid_hover:var(--color-brand-700);
  --color-bg-overlay:var(--color-neutral-950);
  --color-border-primary:var(--color-neutral-300);
  --color-border-secondary:var(--color-neutral-200);
  --color-border-tertiary:var(--color-neutral-100);
  --color-border-brand:var(--color-brand-500);
  --color-border-error:var(--color-red-500);
  --color-utility-brand-600:var(--color-brand-600);
  --color-utility-green-50:var(--color-green-50);
  --color-utility-green-200:var(--color-green-200);
  --color-utility-green-700:var(--color-green-700);
  --color-utility-red-50:var(--color-red-50);
  --color-utility-red-200:var(--color-red-200);
  --color-utility-red-700:var(--color-red-700);
  --color-utility-neutral-50:var(--color-neutral-50);
  --color-utility-neutral-200:var(--color-neutral-200);
  --color-utility-neutral-700:var(--color-neutral-700);
  --color-text-error-primary:var(--color-red-600);

  /* buttons */
  --color-button-primary-bg:var(--color-brand-600);
  --color-button-primary-bg_hover:var(--color-brand-700);
  --color-button-secondary-bg:var(--loop-light-green);
  --color-button-secondary-bg_hover:oklch(from var(--loop-light-green) clamp(0,calc(l + 0.08),1) c h);
  --color-button-secondary-text:var(--black);
  --color-button-filter-bg:var(--loop-lilac);
  --color-button-filter-bg_hover:oklch(from var(--loop-lilac) clamp(0,calc(l + 0.08),1) c h);
  --color-button-filter-text:var(--natural-dark);
  --color-button-light-blue-bg:var(--loop-light-blue);
  --color-button-light-blue-text:var(--natural-dark);
  --color-button-purple-bg:var(--loop-bright-purple);
  --color-button-purple-bg_hover:oklch(from var(--loop-bright-purple) clamp(0,calc(l + 0.08),1) c h);
  --color-button-tertiary-text:var(--loop-green);
  --color-button-tertiary-ring:var(--loop-green);
  --color-focus-ring:var(--color-brand-500);
}

/* semantic — dark (theme.css @layer base .dark) */
.dark{
  --color-text-primary:var(--color-neutral-50);
  --color-text-secondary:var(--color-neutral-300);
  --color-text-tertiary:var(--color-neutral-400);
  --color-text-quaternary:var(--color-neutral-400);
  --color-text-placeholder:var(--color-neutral-500);
  --color-fg-primary:var(--white);
  /* theme.css maps fg-quaternary to --loop-bright-purple in dark; kept neutral
     here so icon chrome doesn't read as an accent colour (see README). */
  --color-fg-quaternary:var(--color-neutral-500);
  --color-fg-brand-primary:var(--color-brand-500);
  --color-bg-primary:var(--color-neutral-950);
  --color-bg-primary_hover:var(--color-neutral-900);
  --color-bg-secondary:var(--color-neutral-900);
  --color-bg-secondary_hover:var(--color-neutral-800);
  --color-bg-tertiary:var(--color-neutral-800);
  --color-bg-quaternary:var(--color-neutral-700);
  --color-bg-brand-secondary:var(--color-brand-600);
  --color-bg-overlay:var(--color-neutral-800);
  --color-border-primary:var(--color-neutral-700);
  --color-border-secondary:var(--color-neutral-800);
  --color-border-tertiary:var(--color-neutral-800);
  --color-border-brand:var(--color-brand-400);
  --color-border-error:var(--color-red-400);
  --color-utility-brand-600:var(--color-brand-400);
  --color-utility-green-50:var(--color-green-950);
  --color-utility-green-200:var(--color-green-800);
  --color-utility-green-700:var(--color-green-300);
  --color-utility-red-50:var(--color-red-950);
  --color-utility-red-200:var(--color-red-800);
  --color-utility-red-700:var(--color-red-300);
  --color-utility-neutral-50:var(--color-neutral-900);
  --color-utility-neutral-200:var(--color-neutral-700);
  --color-utility-neutral-700:var(--color-neutral-300);
  --color-text-error-primary:var(--color-red-400);
  --color-button-tertiary-text:var(--loop-light-green);
  --color-button-tertiary-ring:var(--loop-light-green);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
  font-size:var(--text-md);
  line-height:var(--text-md-lh);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button,input,select{font-family:inherit;color:inherit;}
button{background:none;border:none;padding:0;margin:0;}
h1,h2,h3,p{margin:0;}
:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--color-border-primary);border-radius:9999px;}
::-webkit-scrollbar-track{background:transparent;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.tnum{font-variant-numeric:tabular-nums;}

/* ==========================================================================
   SHELL — sidebar (w-60) + content (ml-60), top nav h-16
   ========================================================================== */
.sidebar{
  position:fixed;inset-block:0;left:0;z-index:20;width:240px;
  display:flex;flex-direction:column;
  transition:width .3s ease-in-out;
  background:var(--color-bg-primary);
}
.sidebar.collapsed{width:48px;}
.sb-head{height:64px;display:flex;align-items:center;padding-left:12px;padding-right:12px;gap:8px;}
.sb-logo{display:block;flex-shrink:0;overflow:hidden;transition:all .3s ease-in-out;}
.sb-logo img{display:block;width:95px;height:34px;}
.dark .sb-logo img{filter:invert(1);}
.sidebar.collapsed .sb-logo{width:31px;}
.sb-collapse{margin-left:auto;flex-shrink:0;cursor:pointer;color:var(--color-fg-primary);display:flex;transition:transform .3s ease-in-out;}
.sidebar.collapsed .sb-collapse{transform:rotate(180deg);margin-left:0;}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 8px;display:flex;flex-direction:column;gap:6px;}
.sb-item{
  display:flex;align-items:center;width:100%;gap:12px;padding:8px;min-height:36px;
  border-radius:5px;font-size:var(--text-sm);line-height:var(--text-sm-lh);
  color:var(--color-text-primary);cursor:pointer;transition:color .1s linear,background-color .1s linear;
  white-space:nowrap;text-align:left;
}
.sb-item svg{flex-shrink:0;width:18px;height:18px;}
.sb-item:hover{background:var(--color-neutral-200);color:var(--color-brand-500);}
.dark .sb-item:hover{background:var(--color-neutral-800);color:var(--loop-bright-green);}
.sb-item.active{font-weight:600;}
.sidebar.collapsed .sb-item span{display:none;}

.content{margin-left:240px;transition:margin-left .3s ease-in-out;min-height:100vh;display:flex;flex-direction:column;}
.content.collapsed{margin-left:48px;}
/* no z-index here: menus rendered inside must be able to sit above .backdrop */
.topnav{height:64px;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;}
main{display:flex;flex-direction:column;width:100%;padding:0 32px 48px;}

/* business switcher */
.biz{
  display:inline-flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-xs);
  cursor:pointer;transition:box-shadow .15s;
}
.biz:hover{box-shadow:var(--shadow-xs);}
.biz .avatar{
  width:32px;height:32px;border-radius:9999px;background:var(--color-brand-500);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:600;flex-shrink:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.biz .name{font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.biz svg{color:var(--color-fg-quaternary);width:16px;height:16px;flex-shrink:0;}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  white-space:nowrap;cursor:pointer;border-radius:9999px;padding:10px 14px;
  font-size:var(--text-sm);line-height:var(--text-sm-lh);font-weight:600;
  transition:background-color .1s linear,color .1s linear,opacity .1s linear;
}
.btn svg{width:20px;height:20px;flex-shrink:0;}
.btn:disabled{cursor:not-allowed;opacity:.5;}
.btn-sm{padding:8px 12px;}
.btn-primary{background:var(--color-button-primary-bg);color:#fff;box-shadow:var(--shadow-xs);}
.btn-primary:hover:not(:disabled){background:var(--color-button-primary-bg_hover);}
.btn-secondary{
  background:var(--color-button-secondary-bg);color:var(--color-button-secondary-text);
  box-shadow:var(--shadow-xs-skeuomorphic);
}
.btn-secondary:hover:not(:disabled){background:var(--color-button-secondary-bg_hover);}
.btn-filter{
  background:var(--color-button-filter-bg);color:var(--color-button-filter-text);
  box-shadow:var(--shadow-xs-skeuomorphic);padding:8px 16px;
}
.btn-filter:hover{background:var(--color-button-filter-bg_hover);}
.btn-purple{background:var(--color-button-purple-bg);color:#fff;box-shadow:var(--shadow-xs);}
.btn-purple:hover{background:var(--color-button-purple-bg_hover);}
.btn-tertiary{
  color:var(--color-button-tertiary-text);box-shadow:inset 0 0 0 1px var(--color-button-tertiary-ring),var(--shadow-xs);
}
.btn-tertiary:hover{opacity:.8;}
.btn-ghost{color:var(--color-text-secondary);}
.btn-ghost:hover{background:var(--color-bg-primary_hover);}
.btn-icon{
  width:36px;height:36px;padding:0;border-radius:var(--radius-xs);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--color-text-tertiary);
}
.btn-icon:hover{background:var(--color-bg-secondary_hover);}
.btn-icon svg{width:20px;height:20px;}
.btn-back{color:var(--color-fg-quaternary);cursor:pointer;display:flex;padding:4px;transition:transform .15s;}
.btn-back:hover{transform:translateX(-4px);}

/* ==========================================================================
   CARDS, TABLES, BADGES, MENUS, PILLS
   ========================================================================== */
.card{
  border-radius:var(--radius-2xl);border:1px solid var(--color-border-secondary);
  background:var(--color-bg-primary);box-shadow:var(--shadow-xs);padding:20px 24px;
}
.page-head{display:flex;align-items:center;gap:8px;width:100%;padding:16px 0;}
.page-head h1{font-size:var(--text-display-xs);line-height:var(--text-display-xs-lh);font-weight:600;letter-spacing:-.2px;}
.page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;}

.table-wrap{
  margin-bottom:40px;overflow:hidden;border-radius:var(--radius-2xl);
  border:1px solid var(--color-border-secondary);background:var(--color-bg-primary);box-shadow:var(--shadow-xs);
}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-weight:600;font-size:var(--text-sm);padding:12px;color:var(--color-text-primary);}
th:first-child,td:first-child{padding-left:24px;}
th:last-child,td:last-child{padding-right:24px;}
td{padding:10px 12px;font-size:var(--text-sm);line-height:var(--text-sm-lh);vertical-align:middle;}
thead th{border-bottom:1px solid var(--color-border-secondary);}
thead.shaded th{background:var(--color-bg-secondary);color:var(--color-text-tertiary);}
tbody tr{border-bottom:1px solid var(--color-border-tertiary);}
tbody tr:last-child{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--color-bg-primary_hover);}
.th-sort{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;padding:2px 4px;margin-left:-4px;}
.th-sort:hover{background:var(--color-bg-secondary_hover);}
.th-sort svg{width:14px;height:14px;color:var(--color-fg-quaternary);}
.th-sort.on svg{color:var(--color-fg-brand-primary);}

.acct-cell{display:flex;align-items:center;gap:8px;min-width:0;}
.acct-cell img.icn{width:24px;height:24px;border-radius:9999px;flex-shrink:0;}
.acct-cell .inst{
  width:24px;height:24px;border-radius:9999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px;font-weight:700;
}
.acct-name{font-size:var(--text-sm);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acct-sub{font-size:var(--text-xs);line-height:var(--text-xs-lh);color:var(--color-text-quaternary);white-space:nowrap;}
.flag{width:20px;height:20px;border-radius:9999px;flex-shrink:0;}

.badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 8px;
  font-size:var(--text-xs);line-height:var(--text-xs-lh);font-weight:500;
}
.badge svg{width:12px;height:12px;stroke-width:3;}
.badge-green{background:var(--color-utility-green-50);color:var(--color-utility-green-700);box-shadow:inset 0 0 0 1px var(--color-utility-green-200);}
.badge-red{background:var(--color-utility-red-50);color:var(--color-utility-red-700);box-shadow:inset 0 0 0 1px var(--color-utility-red-200);}
.badge-gray{background:var(--color-utility-neutral-50);color:var(--color-utility-neutral-700);box-shadow:inset 0 0 0 1px var(--color-utility-neutral-200);}
.badge-brand{background:var(--loop-light-green);color:var(--color-brand-700);box-shadow:none;font-weight:600;}

/* segmented control (TimeRangeSelector) */
.seg{display:inline-flex;align-items:center;gap:2px;border-radius:9999px;background:var(--color-bg-tertiary);padding:4px;font-size:var(--text-sm);font-weight:500;}
.seg button{position:relative;cursor:pointer;border-radius:9999px;padding:4px 12px;color:var(--color-text-tertiary);white-space:nowrap;}
.seg button.on{
  background:var(--color-bg-primary);color:var(--color-text-primary);
  box-shadow:var(--shadow-xs),inset 0 0 0 1px var(--color-border-secondary);
}

/* dropdown menu (Dropdown.Popover) */
.menu{
  position:absolute;z-index:60;min-width:248px;border-radius:var(--radius-lg);
  background:var(--color-bg-primary);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--color-border-secondary);
  padding:4px 0;overflow:hidden;
}
.menu-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  margin:1px 6px;padding:8px 10px;border-radius:var(--radius-xs);width:calc(100% - 12px);
  transition:background-color .1s linear;
}
.menu-item:hover{background:var(--color-bg-primary_hover);}
.menu-item[aria-disabled="true"]{cursor:not-allowed;opacity:.6;}
.menu-item svg{width:16px;height:16px;stroke-width:2.25;color:var(--color-fg-quaternary);flex-shrink:0;}
.menu-item .label{flex:1;min-width:0;font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);}
.menu-item .addon{font-size:var(--text-xs);color:var(--color-text-quaternary);}
.menu-label{padding:8px 16px 4px;font-size:var(--text-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-quaternary);}
.menu-sep{height:1px;background:var(--color-border-secondary);margin:4px 0;}
.menu-rich{align-items:flex-start;gap:12px;}
.menu-rich .ic{
  width:36px;height:36px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.menu-rich .ic svg{width:20px;height:20px;stroke-width:2;}
.menu-rich .t{font-size:var(--text-sm);font-weight:600;color:var(--color-text-primary);display:block;}
.menu-rich .d{font-size:var(--text-xs);line-height:var(--text-xs-lh);color:var(--color-text-quaternary);display:block;margin-top:2px;white-space:normal;}
.backdrop{position:fixed;inset:0;z-index:55;}

/* ==========================================================================
   CHART
   ========================================================================== */
.chart-host{position:relative;width:100%;}
.chart-host svg{display:block;}
.chart-tip{
  position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-100%);
  background:var(--color-bg-primary);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--color-border-secondary);
  border-radius:var(--radius-xs);padding:6px 10px;white-space:nowrap;opacity:0;transition:opacity .1s;
}
.chart-tip .d{font-size:var(--text-xs);color:var(--color-text-tertiary);}
.chart-tip .v{font-size:var(--text-sm);font-weight:600;color:var(--color-text-primary);}
.empty-chart{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  min-height:192px;padding:24px;
}
.featured-icon{
  width:48px;height:48px;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--color-bg-secondary);color:var(--color-text-tertiary);
  box-shadow:inset 0 0 0 1px var(--color-border-secondary);
}
.featured-icon svg{width:22px;height:22px;}
.featured-icon.brand{background:var(--loop-light-green);color:var(--color-brand-600);box-shadow:none;}
.featured-icon.green{background:var(--color-utility-green-50);color:var(--color-utility-green-700);box-shadow:inset 0 0 0 1px var(--color-utility-green-200);}
.featured-icon.red{background:var(--color-utility-red-50);color:var(--color-utility-red-700);box-shadow:inset 0 0 0 1px var(--color-utility-red-200);}
.empty-title{font-size:var(--text-md);font-weight:600;}
.empty-desc{font-size:var(--text-sm);color:var(--color-text-tertiary);max-width:340px;}

/* interest bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;position:relative;}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;border-radius:8px;}
.bar-col:hover{background:var(--color-bg-secondary);}
.bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--color-utility-brand-600);transition:height .25s ease-out,opacity .1s linear;}
.bar-col:hover .bar{opacity:.75;}
.bar-tip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--color-bg-primary);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--color-border-secondary);
  border-radius:var(--radius-xs);padding:5px 9px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .1s;font-size:var(--text-xs);color:var(--color-text-tertiary);z-index:4;
}
.bar-tip b{color:var(--color-text-primary);font-weight:600;}
.bar-col{position:relative;}
.bar-col:hover .bar-tip{opacity:1;}
.bar-axis{display:flex;gap:8px;padding-top:8px;font-size:var(--text-xs);color:var(--color-text-quaternary);}
.bar-axis div{flex:1;text-align:center;}

/* ==========================================================================
   MODALS / FORMS
   ========================================================================== */
.overlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:16px;background:color-mix(in srgb,var(--color-bg-overlay) 35%,transparent);
  backdrop-filter:blur(1px);
}
.modal{
  width:520px;max-width:100%;max-height:calc(100vh - 64px);overflow-y:auto;
  background:var(--color-bg-primary);border-radius:var(--radius-2xl);
  box-shadow:var(--shadow-2xl),inset 0 0 0 1px var(--color-border-secondary);padding:24px;
}
.modal-head{display:flex;align-items:flex-start;gap:16px;}
.modal-head h2{font-size:var(--text-lg);line-height:var(--text-lg-lh);font-weight:600;}
.modal-head p{margin-top:4px;font-size:var(--text-sm);line-height:var(--text-sm-lh);color:var(--color-text-tertiary);}
.modal-x{margin-left:auto;flex-shrink:0;}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;}
.field{display:block;margin-top:16px;}
.field > .lbl{display:block;font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;}
.field .opt{font-weight:400;color:var(--color-text-quaternary);}
.control{
  width:100%;display:flex;align-items:center;gap:8px;border-radius:var(--radius-xs);
  background:var(--color-bg-primary);border:1px solid var(--color-border-secondary);
  padding:10px 12px;font-size:var(--text-md);color:var(--color-text-primary);
  transition:box-shadow .1s linear,border-color .1s linear;
}
select.control{cursor:pointer;appearance:none;background-image:none;padding-right:36px;}
.select-wrap{position:relative;}
.select-wrap > svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;width:20px;height:20px;color:var(--color-fg-quaternary);}
.control:focus{outline:none;border-color:transparent;box-shadow:0 0 0 2px var(--color-brand-500);}
.control::placeholder{color:var(--color-text-placeholder);}
.control.err{border-color:var(--color-border-error);}
.control.err:focus{box-shadow:0 0 0 2px var(--color-border-error);}
.hint{margin-top:6px;font-size:var(--text-sm);color:var(--color-text-tertiary);}
.hint.err{color:var(--color-text-error-primary);}
.alert{
  display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-xs);padding:12px 14px;margin-top:16px;
  font-size:var(--text-sm);line-height:var(--text-sm-lh);
}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;}
.alert-error{background:var(--color-utility-red-50);color:var(--color-utility-red-700);box-shadow:inset 0 0 0 1px var(--color-utility-red-200);}
.alert-info{background:var(--loop-light-blue);color:var(--natural-dark);}
.dark .alert-info{background:var(--color-neutral-800);color:var(--color-text-secondary);}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--color-border-secondary);border-radius:var(--radius-md);padding:14px 16px;
  background:var(--color-bg-primary);transition:border-color .1s linear,background-color .1s linear;
}
.choice:hover{border-color:var(--color-border-brand);background:var(--color-bg-secondary);}
.choice.off{cursor:not-allowed;opacity:.65;background:var(--color-bg-secondary);}
.choice.off:hover{border-color:var(--color-border-secondary);}
.choice img{width:32px;height:32px;border-radius:9999px;flex-shrink:0;}
.choice .t{font-size:var(--text-sm);font-weight:600;display:block;}
.choice .d{font-size:var(--text-xs);color:var(--color-text-quaternary);display:block;margin-top:1px;}
.meter{height:8px;border-radius:9999px;background:var(--color-bg-tertiary);overflow:hidden;margin-top:10px;}
.meter > div{height:100%;border-radius:9999px;background:var(--color-brand-500);}
.kv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--text-sm);}

.modal.flush{padding:0;}
.modal-titlebar{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--color-border-secondary);}
.modal-titlebar h2{font-size:var(--text-md);line-height:var(--text-md-lh);font-weight:600;}
.modal-titlebar .tb-ic{display:flex;flex-shrink:0;color:var(--color-fg-primary);}
.tb-x{margin-left:auto;flex-shrink:0;display:flex;cursor:pointer;padding:2px;border-radius:6px;color:var(--color-brand-500);}
.dark .tb-x{color:var(--loop-bright-green);}
.tb-x:hover{opacity:.7;}
.modal-body{padding:20px;}
.doc-section + .doc-section{margin-top:18px;}
.doc-section h3{font-size:var(--text-sm);line-height:var(--text-sm-lh);font-weight:600;}
.doc-section p{margin-top:2px;font-size:var(--text-sm);line-height:1.6;color:var(--color-text-secondary);}
.empty-sq{
  width:44px;height:44px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px var(--color-border-secondary);color:var(--color-fg-primary);
}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px 0;}
.doc-row + .doc-row{border-top:1px solid var(--color-border-tertiary);}
.doc-row .doc-ic{
  width:34px;height:34px;flex-shrink:0;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px var(--color-border-secondary);color:var(--color-text-tertiary);
}
.doc-row .t{display:block;font-size:var(--text-sm);font-weight:600;}
.doc-row .s{display:block;font-size:var(--text-xs);color:var(--color-text-quaternary);}
.doc-row .btn{margin-left:auto;}
.rows{margin-top:20px;display:flex;flex-direction:column;}
.rows > div{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:var(--text-sm);}
.rows > div + div{border-top:1px solid var(--color-border-tertiary);}

/* listbox with leading media (flags), matching base/select's item layout */
.picker{position:relative;display:block;}
.picker-trigger{cursor:pointer;text-align:left;}
.picker-trigger .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.picker-trigger .val.ph{color:var(--color-text-placeholder);}
.picker-trigger > svg{flex-shrink:0;color:var(--color-fg-quaternary);transition:transform .15s;}
.picker.open .picker-trigger{border-color:transparent;box-shadow:0 0 0 2px var(--color-brand-500);}
.picker.open .picker-trigger > svg{transform:rotate(180deg);}
.picker-menu{top:calc(100% + 6px);left:0;width:100%;min-width:0;max-height:264px;overflow-y:auto;}
.picker-menu .menu-item{align-items:center;}
.picker-menu .menu-item .label{font-weight:500;color:var(--color-text-primary);}
.picker-menu .menu-item .sub{display:block;font-size:var(--text-xs);font-weight:400;color:var(--color-text-quaternary);}
.spinner{width:16px;height:16px;border-radius:9999px;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-xs);
  background:var(--color-neutral-900);color:var(--color-neutral-50);box-shadow:var(--shadow-xl);
  font-size:var(--text-sm);font-weight:500;
}
.dark .toast{background:var(--color-neutral-800);}
.toast .tick{
  width:20px;height:20px;border-radius:9999px;background:var(--loop-bright-green);color:var(--color-brand-800);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.toast .tick svg{width:12px;height:12px;stroke-width:3;}

/* detail page */
.detail-title{display:flex;align-items:center;gap:8px;position:relative;}
.detail-title h1{font-size:var(--text-display-xs);line-height:var(--text-display-xs-lh);font-weight:600;}
.switcher-btn{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:var(--radius-xs);padding:4px 8px;margin-left:-8px;}
.switcher-btn:hover{background:var(--color-bg-primary_hover);}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px;}
.detail-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch;}
.detail-grid > .chart-card{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;}
.detail-grid > .side{flex:0 1 380px;min-width:0;display:flex;flex-direction:column;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;}
.metric .k{display:flex;align-items:center;gap:4px;font-size:var(--text-xs);color:var(--color-text-tertiary);}
.metric .k svg{width:14px;height:14px;color:var(--color-fg-quaternary);}
.metric .v{font-size:var(--text-lg);line-height:var(--text-lg-lh);font-weight:600;margin-top:2px;}
.metric .s{font-size:var(--text-xs);color:var(--color-text-quaternary);}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--color-border-secondary);margin:32px 0 0;}
.tab{
  padding:8px 2px 12px;font-size:var(--text-sm);font-weight:600;color:var(--color-text-quaternary);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
/* card header: underline tabs left, period pills right, one row tall */
.card.tabbed{padding-top:0;}
.card-tabs{
  display:flex;align-items:stretch;gap:20px;margin:0 -24px;padding:0 24px;
  border-bottom:1px solid var(--color-border-secondary);
}
.card-tabs .tab{display:flex;align-items:center;min-height:48px;padding:0 2px;}
.card-tabs .range{margin-left:auto;display:flex;align-items:center;padding-left:12px;}
.tab:hover{color:var(--color-text-secondary);}
.tab.on{color:var(--color-fg-brand-primary);border-bottom-color:var(--color-fg-brand-primary);}
.dark .tab.on{color:var(--loop-bright-green);border-bottom-color:var(--loop-bright-green);}
.table-foot{

  font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);cursor:pointer;
  border-top:1px solid var(--color-border-tertiary);
}
.table-foot:hover{background:var(--color-bg-primary_hover);}
.table-foot svg{width:16px;height:16px;}
/* hover/focus tooltip, like base/tooltip's TooltipTrigger */
.info-wrap{position:relative;display:inline-flex;}
.tooltip-pop{
  /* width:max-content so shrink-to-fit isn't clamped by the narrow label it anchors to */
  position:absolute;z-index:70;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  width:max-content;max-width:280px;border-radius:var(--radius-xs);padding:10px 12px;
  background:var(--color-neutral-900);color:var(--color-neutral-100);font-size:var(--text-xs);line-height:1.5;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .1s linear;
}
.dark .tooltip-pop{background:var(--color-neutral-800);}
.info-wrap:hover .tooltip-pop,.info-wrap:focus-within .tooltip-pop{opacity:1;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin:-4px;
  border-radius:var(--radius-xs);cursor:pointer;color:var(--color-fg-primary);transition:background-color .1s linear;
}
.icon-btn:hover{background:var(--color-bg-secondary_hover);}
.info-btn{display:inline-flex;color:var(--color-fg-quaternary);cursor:help;}
.info-btn:hover{color:var(--color-text-tertiary);}
.info-btn svg{width:16px;height:16px;}

.bubble{
  position:fixed;right:20px;bottom:20px;width:48px;height:48px;border-radius:9999px;

}

  border-radius:var(--radius-md);background:var(--color-bg-primary);
  box-shadow:var(--shadow-xl),inset 0 0 0 1px var(--color-border-secondary);

}

.proto-head .t{font-weight:600;font-size:var(--text-xs);letter-spacing:.02em;text-transform:uppercase;color:var(--color-text-quaternary);}
.proto-head .c{margin-left:auto;color:var(--color-fg-quaternary);}
.proto-body{padding:0 12px 12px;display:none;flex-direction:column;gap:12px;}
.proto.open .proto-body{display:flex;}
.proto-row .k{font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;display:block;}
.proto .seg{width:100%;font-size:11px;}
.proto .seg button{flex:1;padding:4px 6px;text-align:center;}
.proto select{
  width:100%;font-size:var(--text-xs);padding:6px 8px;border-radius:var(--radius-xs);

}
.proto .note{color:var(--color-text-quaternary);line-height:1.45;}

@media (max-width:1100px){
  .detail-grid > .side{flex:1 1 100%;}
}
@media (max-width:900px){
  .content{margin-left:48px;}
  .sidebar{width:48px;}
  .sidebar .sb-item span,.sidebar .sb-logo{display:none;}
  main{padding:0 16px 48px;}
  .proto{display:none;}
}

/* ------------------------------------------------------- balance histories -- */
const mulberry = seed => () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

// 365 daily points ending today; deterministic per account, ends on the real balance.
const historyCache = {};
function balanceHistory(a) {
  if (historyCache[a.id]) return historyCache[a.id];
  const days = Math.min(365, Math.max(0, Math.round((TODAY - a.opened) / 86400000)));
  if (!a.opened || days < 2 || !a.balance) { historyCache[a.id] = []; return []; }
  const rnd = mulberry(hash(a.id));
  const steps = [];
  let v = a.balance * (0.45 + rnd() * 0.2);
  for (let i = 0; i <= days; i++) {
    steps.push(v);
    const drift = a.balance * 0.004 * (rnd() - 0.35);
    const jump = rnd() > 0.975 ? a.balance * (0.05 + rnd() * 0.12) : 0;
    v = Math.max(0, v + drift + jump);
  }
  const last = steps[steps.length - 1] || 1;
  const scale = a.balance / (last || 1);
  const out = steps.map((amount, i) => ({
    date: addDays(TODAY, -(days - i)),
    amount: amount * scale
  }));
  out[out.length - 1].amount = a.balance;
  historyCache[a.id] = out;
  return out;
}
const invalidateHistory = id => { delete historyCache[id]; };

function aggregateHistory() {
  const loop = state.accounts.filter(a => a.cat !== 'linked');
  const series = loop.map(a => ({ rate: RATES[a.cur], pts: balanceHistory(a) })).filter(s => s.pts.length);
  if (!series.length) return [];
  const len = Math.max.apply(null, series.map(s => s.pts.length));
  const out = [];
  for (let i = 0; i < len; i++) {
    let sum = 0, date = null;
    series.forEach(s => {
      const idx = s.pts.length - len + i;
      const p = idx >= 0 ? s.pts[idx] : s.pts[0];
      sum += p.amount * s.rate;
      if (idx >= 0) date = p.date;
    });
    out.push({ date: date || addDays(TODAY, -(len - 1 - i)), amount: sum });
  }
  return out;
}
const totalBalanceCad = () =>
  state.accounts.filter(a => a.cat !== 'linked').reduce((s, a) => s + (a.balance || 0) * RATES[a.cur], 0);

const RANGES = [['7d', '7 days', 7], ['30d', '30 days', 30], ['90d', '90 days', 90], ['12m', '12 months', 365]];
function sliceRange(series, key) {
  const n = (RANGES.find(r => r[0] === key) || RANGES[1])[2];
  return series.slice(Math.max(0, series.length - n));
}
function availableRanges(series) {
  return RANGES.filter(r => series.length > 2).filter((r, i) => i === 0 || series.length >= r[2] * 0.5);
}

/* ============================================================ CHART ======= */
function niceTicks(min, max, count) {
  if (min === max) { min = Math.min(0, min); max = max || 1; }
  const span = max - min || 1;
  const raw = span / (count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Number(v.toFixed(6)));
  return ticks;
}
// Axis label: compact, but keeps enough decimals that neighbouring ticks differ.
const decimalsFor = step => Math.max(0, Math.min(2, Math.ceil(-Math.log10(step))));
const shortMoney = (v, cur, step) => {
  const abs = Math.max(Math.abs(v), step || 1);
  if (abs >= 1000000) return fmt(v / 1000000, cur, { maximumFractionDigits: decimalsFor((step || 1) / 1000000) }) + 'M';
  if (abs >= 1000) return fmt(v / 1000, cur, { maximumFractionDigits: decimalsFor((step || 1) / 1000) }) + 'k';
  return fmt(v, cur, { maximumFractionDigits: decimalsFor(step || 1) });
};

function drawChart(host) {
  const series = host.__series || [];
  const cur = host.__cur || 'CAD';
  const w = Math.max(280, host.clientWidth || 640);
  const h = 190, padL = 58, padR = 10, padT = 10, padB = 24;
  if (series.length < 2) { host.innerHTML = ''; return; }

  const vals = series.map(p => p.amount);
  const ticks = niceTicks(Math.min.apply(null, vals), Math.max.apply(null, vals), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = i => padL + (w - padL - padR) * (series.length === 1 ? 0 : i / (series.length - 1));
  const y = v => padT + (h - padT - padB) * (1 - (v - lo) / ((hi - lo) || 1));

  let line = '', area = '';
  series.forEach((p, i) => {
    const cmd = (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.amount).toFixed(1);
    line += cmd; area += cmd;
  });
  area += 'L' + x(series.length - 1).toFixed(1) + ',' + (h - padB) + 'L' + padL + ',' + (h - padB) + 'Z';

  const grid = ticks.map(t =>
    '<line x1="' + padL + '" y1="' + y(t).toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y(t).toFixed(1) + '"/>').join('');
  const step = ticks.length > 1 ? ticks[1] - ticks[0] : 1;
  const yLabels = ticks.map(t =>
    '<text x="' + (padL - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end">' + esc(shortMoney(t, cur, step)) + '</text>').join('');
  const tickCount = Math.min(6, series.length);
  let xLabels = '';
  for (let i = 0; i < tickCount; i++) {
    const idx = Math.round(i * (series.length - 1) / (tickCount - 1 || 1));
    xLabels += '<text x="' + x(idx).toFixed(1) + '" y="' + (h - 4) + '" text-anchor="' +
      (i === 0 ? 'start' : i === tickCount - 1 ? 'end' : 'middle') + '">' + esc(shortDate(series[idx].date)) + '</text>';
  }

  host.innerHTML =
    '<svg width="' + w + '" height="' + h + '" role="img" aria-label="Balance over the selected range">' +
      '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--color-utility-brand-600)" stop-opacity=".18"/>' +
        '<stop offset="100%" stop-color="var(--color-utility-brand-600)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<g stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="3 4">' + grid + '</g>' +
      '<g fill="var(--color-text-quaternary)" font-size="11" font-family="var(--font-body)">' + yLabels + xLabels + '</g>' +
      '<path d="' + area + '" fill="url(#ag)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--color-utility-brand-600)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line class="cursor" y1="' + padT + '" y2="' + (h - padB) + '" stroke="var(--color-border-primary)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
      '<circle class="dot" r="4" fill="var(--color-bg-primary)" stroke="var(--color-utility-brand-600)" stroke-width="2.5" style="display:none"/>' +
    '</svg>' +
    '<div class="chart-tip"><div class="v"></div><div class="d"></div></div>';

  const svg = host.querySelector('svg');
  const cursor = host.querySelector('.cursor');
  const dot = host.querySelector('.dot');
  const tip = host.querySelector('.chart-tip');

  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (w / rect.width);
    let i = Math.round((px - padL) / ((w - padL - padR) / (series.length - 1)));
    i = Math.max(0, Math.min(series.length - 1, i));
    const p = series[i];
    cursor.setAttribute('x1', x(i)); cursor.setAttribute('x2', x(i)); cursor.style.display = '';
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(p.amount)); dot.style.display = '';
    tip.querySelector('.v').textContent = fmt(p.amount, cur);
    tip.querySelector('.d').textContent = longDate(p.date);
    tip.style.left = (x(i) / w * 100) + '%';
    tip.style.top = (y(p.amount) - 12) + 'px';
    tip.style.opacity = '1';
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => {
    cursor.style.display = 'none'; dot.style.display = 'none'; tip.style.opacity = '0';
  });
}

let chartRO = null;
function mountCharts() {
  if (chartRO) chartRO.disconnect();
  chartRO = new ResizeObserver(entries => entries.forEach(e => drawChart(e.target)));
  document.querySelectorAll('.chart-host').forEach(host => {
    if (host.getAttribute('data-chart') === 'detail') {
      const a = byId(state.detailId) || {};
      host.__series = sliceRange(balanceHistory(a), state.detailRange);
      host.__cur = a.cur || 'CAD';
    } else {
      host.__series = sliceRange(aggregateHistory(), state.listRange);
      host.__cur = 'CAD';
    }
    drawChart(host);
    chartRO.observe(host);
  });
}

const CAT_ORDER = { operating: 0, savings: 1, linked: 2 };
function sortedAccounts() {
  const rows = state.accounts.filter(a => state.filter === 'all' || a.cat === state.filter);
  // default order groups by type (operating → savings → linked), like the app's
  // loop-then-linked grouping, so a new account lands with its own kind
  if (!state.sortKey) {
    return rows.map((a, i) => [a, i]).sort((x, y) =>
      (CAT_ORDER[x[0].cat] - CAT_ORDER[y[0].cat]) || (x[1] - y[1])).map(p => p[0]);
  }
  const dir = state.sortDir === 'asc' ? 1 : -1;
  const val = a => {
    switch (state.sortKey) {
      case 'name': return displayName(a).toLowerCase();
      case 'balance': return a.cat === 'linked' ? -Infinity : (a.balance || 0);
      case 'cur': return a.cur;
      case 'country': return countryOf(a).toLowerCase();
      default: return TYPE_LABEL[a.cat].toLowerCase();
    }
  };
  return rows.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y)) * dir;
  });
}

function detailView() {

  const cur = a.cur;
  const series = balanceHistory(a);
  const ranges = availableRanges(series);
  const shown = sliceRange(series, state.detailRange);
  const interest = a.interest || [];
  const lifetime = interest.reduce((s, m) => s + m.amount, 0);
  const last = interest.length ? interest[interest.length - 1].amount : 0;
  const payout = firstOfNextMonth(TODAY);

  const isBalance = state.chartTab === 'balance';
  const iRanges = [['3m', '3 months'], ['6m', '6 months'], ['1y', '1 year'], ['all', 'All']];
  const iRangeLabel = { '3m': 'the last 3 months', '6m': 'the last 6 months', '1y': 'the last year', 'all': 'the life of this account' }[state.interestRange];
  const iCount = { '3m': 3, '6m': 6, '1y': 12, 'all': interest.length }[state.interestRange] || 6;
  const iShown = interest.slice(Math.max(0, interest.length - iCount));
  const iTotal = iShown.reduce((s, m) => s + m.amount, 0);
  const iMax = Math.max.apply(null, iShown.map(m => m.amount).concat([1]));

  const pending = a.status === 'pending';

    '<div><strong>We’re setting up your account.</strong> Deposits and withdrawals unlock once provisioning finishes — usually a few minutes.</div></div>' : '') +

    '<section class="card chart-card tabbed">' +

        '<button class="tab' + (isBalance ? ' on' : '') + '" data-act="chart-tab" data-arg="balance">Balance</button>' +
        '<button class="tab' + (isBalance ? '' : ' on') + '" data-act="chart-tab" data-arg="interest">Interest Earned</button>' +

        'Interest accrues daily on your savings balance and is paid into this account on the 1st of each month.</p>' +

function txTable(a) {
  const txs = (a.txs || []).slice(0, 10);
  if (!txs.length) {
    return '<div class="table-wrap"><div style="padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">' +
      '<span class="featured-icon">' + icon('Repeat01', 22) + '</span>' +
      '<div class="empty-title">No transactions yet</div>' +
      '<div class="empty-desc">Add funds from one of your Loop accounts to get started. Savings accounts move money between Loop accounts only.</div>' +
      '</div></div>';
  }
  const rows = txs.map(t => {
    const st = t.status || 'Posted';
    const cls = st === 'Posted' ? 'badge-green' : st === 'Cancelled' ? 'badge-gray' : 'badge-red';
    return '<tr>' +
      '<td style="color:var(--color-text-secondary)">' + esc(longDate(t.date)) + '</td>' +
      '<td>' + esc(txName(a, t.from)) + (t.kind === 'interest' ? ' <span class="badge badge-brand" style="margin-left:4px">Interest</span>' : '') + '</td>' +
      '<td>' + esc(txName(a, t.to)) + '</td>' +

        '<span class="tnum" style="font-weight:600;color:' + (t.amount > 0 ? 'var(--color-utility-green-700)' : 'var(--color-text-primary)') + '">' +
        esc(fmt(t.amount, a.cur, { signDisplay: 'exceptZero' })) + '</span></div></td>' +
      '<td><span class="badge ' + cls + '">' + esc(st) + '</span></td>' +
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table aria-label="Recent transactions">' +
    '<thead class="shaded"><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Status</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="table-foot" data-act="soon" data-arg="Transactions">View All Transactions' + icon('ArrowNarrowRight', 16) + '</div></div>';
}

// One T5 per currency, issued for completed tax years only.
function taxYears(a) {
  const years = [];
  if (a.interest && a.interest.length) {
    const first = a.interest[0].date.getFullYear();
    for (let y = first; y < TODAY.getFullYear(); y++) {
      const total = a.interest.filter(m => m.date.getFullYear() === y).reduce((s, m) => s + m.amount, 0);
      if (total > 0) years.push({ year: y, total: total });
    }
  }
  return years.reverse();
}

function applyTheme() {
  const dark = state.theme === 'dark' ||
    (state.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
function syncHash() {
  const want = state.view === 'detail' ? '#/accounts/' + state.detailId : '#/accounts';
  if (location.hash !== want) history.replaceState(null, '', want);
}
function render() {
  applyTheme();
  $('#sidebar').classList.toggle('collapsed', state.collapsed);
  $('#content').classList.toggle('collapsed', state.collapsed);
  $('#main').innerHTML = state.view === 'detail' ? detailView() : listView();
  renderOverlays();
  renderProto();
  mountCharts();
  syncHash();
}
function set(patch) { Object.assign(state, patch); render(); }
let toastTimer = null;
function toast(msg) {
  clearTimeout(toastTimer);
  state.toast = msg;
  renderOverlays();
  toastTimer = setTimeout(() => { state.toast = null; renderOverlays(); }, 3200);
}

function openDetail(id) {

  if (!a) return;
  set({

    chartTab: 'balance', detailRange: '30d', interestRange: '6m', bottomTab: 'transactions'
  });

}

function createSavings() {
  const f = state.form;
  const currency = f.currency === undefined ? 'CAD' : f.currency;
  const kind = f.kind === undefined ? 'SAVINGS' : f.kind;

  // client-side validation first (mirrors the form's required fields)
  const errCurrency = !currency ? 'Select a currency.' : '';
  const errKind = !kind ? 'Select an account type.' : '';
  if (errCurrency || errKind) {
    state.form = Object.assign({}, f, { errCurrency: errCurrency, errKind: errKind, error: null });
    return render();
  }

  state.form = Object.assign({}, f, { errCurrency: '', errKind: '', error: null, loading: true });
  render();

  setTimeout(() => {
    const outcome = state.nextResult;
    if (outcome === 'validation_failed') {
      state.form = Object.assign({}, state.form, { loading: false, errCurrency: 'This currency isn’t available for savings accounts yet.' });
      return render();
    }
    if (outcome !== 'active' && outcome !== 'pending') {
      state.form = Object.assign({}, state.form, { loading: false, error: outcome });
      return render();
    }
    const id = nextId('fa');
    const acct = {
      id: id, cat: 'savings', cur: currency, nickname: (state.form.nickname || '').trim(),
      balance: 0, status: outcome === 'pending' ? 'pending' : 'active',
      opened: TODAY, interest: [], txs: []
    };
    state.accounts = state.accounts.concat([acct]);
    state.newId = id;
    state.filter = 'all';
    state.form = { done: true, createdId: id };
    render();
  }, 700);
}

function submitTransfer(kind) {
  const a = byId(state.detailId);
  if (!a) return;
  // fall back to the select's default option — it may never have fired a change
  const counterparts = state.accounts.filter(x => x.cat === 'operating' && x.cur === a.cur);
  const other = byId(state.form.other || (counterparts[0] || {}).id || '');
  const amount = parseFloat(String(state.form.amount || '').replace(/[^0-9.]/g, ''));
  const isAdd = kind === 'addfunds';
  const source = isAdd ? other : a;
  if (!a || !other) return;
  if (!(amount > 0)) {
    state.form = Object.assign({}, state.form, { errAmount: 'Enter an amount greater than zero.' });
    return render();
  }
  if (amount > (source.balance || 0)) {
    state.form = Object.assign({}, state.form, { errAmount: 'Amount exceeds the available balance in ' + displayName(source) + '.' });
    return render();
  }
  const target = isAdd ? a : other;
  source.balance = Number((source.balance - amount).toFixed(2));
  target.balance = Number((target.balance + amount).toFixed(2));
  a.txs = [{
    date: TODAY,
    from: isAdd ? displayName(other) : 'self',
    to: isAdd ? 'self' : displayName(other),
    amount: isAdd ? amount : -amount
  }].concat(a.txs || []);
  invalidateHistory(a.id); invalidateHistory(other.id);
  set({ modal: null, form: {} });
  toast(isAdd ? fmt(amount, a.cur) + ' added to ' + displayName(a) : fmt(amount, a.cur) + ' withdrawn to ' + displayName(other));
}

const ACTIONS = {
  nav: label => toast(label + ' isn’t part of this prototype.'),
  bubble: () => toast('Support chat isn’t part of this prototype.'),
  soon: what => { set({ menu: null }); toast(what + ' isn’t wired up in this prototype.'); },
  menu: (key, ev) => {
    if (key.indexOf('row:') === 0 && ev) {
      const r = ev.target.closest('[data-act]').getBoundingClientRect();
      state.menuRect = { top: Math.round(r.bottom + 4), right: Math.round(window.innerWidth - r.right) };
    }
    set({ menu: state.menu === key ? null : key });
  },
  'close-menus': () => set({ menu: null }),
  close: () => set({ modal: null, form: {}, menu: null }),
  backdrop: (a, ev) => { if (ev.target.classList.contains('overlay')) set({ modal: null, form: {} }); },
  filter: key => set({ filter: key, menu: null }),
  sort: key => set({
    sortKey: state.sortKey === key && state.sortDir === 'desc' ? null : key,
    sortDir: state.sortKey === key && state.sortDir === 'asc' ? 'desc' : 'asc',
    menu: null
  }),
  open: id => openDetail(id),
  back: () => set({ view: 'list', detailId: null, menu: null, modal: null }),
  'list-range': r => set({ listRange: r }),
  'detail-range': r => set({ detailRange: r }),
  'chart-tab': t => set({ chartTab: t }),
  'interest-range': r => set({ interestRange: r }),
  tab: t => set({ bottomTab: t }),
  picker: name => { state.form.open = state.form.open === name ? null : name; render(); },
  pick: arg => {
    const i = arg.indexOf(':');
    const name = arg.slice(0, i), value = arg.slice(i + 1);
    state.form[name] = value;
    state.form.open = null;
    // clear the matching inline error as soon as a valid choice is made
    if (value) state.form[name === 'currency' ? 'errCurrency' : 'errKind'] = '';
    render();
  },
  'operating-modal': () => set({ modal: 'operating', menu: null, form: {} }),
  'savings-modal': () => set({ modal: 'savings', menu: null, form: {} }),
  'linked-modal': () => set({ modal: 'linked', menu: null, form: {} }),
  'submit-savings': () => createSavings(),
  'create-operating': cur => {
    const id = nextId('fa');
    state.accounts = state.accounts.concat([{
      id: id, cat: 'operating', cur: cur, nickname: '', balance: 0, status: 'active', opened: TODAY
    }]);
    set({ modal: null, newId: id, filter: 'all' });
    toast(cur + ' operating account opened.');
  },
  'submit-linked': () => {
    const f = state.form;
    const last4 = (f.last4 || '').replace(/\D/g, '');
    if (last4.length !== 4) {
      state.form = Object.assign({}, f, { errLast4: 'Enter the last 4 digits.' });
      return render();
    }
    const id = nextId('lk');
    state.accounts = state.accounts.concat([{
      id: id, cat: 'linked', cur: f.cur || 'CAD', inst: f.inst || 'Wealthsimple',
      last4: last4, nickname: (f.nickname || '').trim(), status: 'active'
    }]);
    set({ modal: null, form: {}, newId: id, filter: 'all' });
    toast('External account linked.');
  },
  nickname: id => set({ modal: 'nickname', menu: null, form: { id: id, nickname: (byId(id) || {}).nickname || '' } }),
  'save-nickname': () => {
    const a = byId(state.form.id);
    if (a) a.nickname = (state.form.nickname || '').trim();
    set({ modal: null, form: {} });
    toast('Nickname updated.');
  },
  addfunds: () => set({ modal: 'addfunds', form: {} }),
  withdraw: () => set({ modal: 'withdraw', form: {} }),
  'submit-transfer': kind => submitTransfer(kind),
  protection: () => set({ modal: 'protection' }),
  // instant download — the PDF is inlined, so no network and no modal
  proof: () => {
    const acct = byId(state.detailId) || {};
    const cur = ASSETS.proofs[acct.cur] ? acct.cur : 'CAD';
    const src = ASSETS.proofs[cur];
    if (!src) return toast('No sample document is bundled for this account.');
    const link = document.createElement('a');
    link.href = src;
    link.download = 'proof-of-account-details-' + cur + '.pdf';
    document.body.appendChild(link);
    link.click();
    link.remove();
    toast('Proof of account details downloaded.');
  },
  theme: t => { state.theme = t; localStorage.setItem('loop-proto-theme', t); set({ menu: null }); },
  flag: v => set({ flagCreate: v === 'on', menu: null }),
  'proto-toggle': () => set({ protoOpen: !state.protoOpen }),
  reset: () => {
    Object.keys(historyCache).forEach(k => delete historyCache[k]);
    set({
      accounts: seedAccounts(), view: 'list', detailId: null, filter: 'all', sortKey: null,
      newId: null, modal: null, form: {}, menu: null, nextResult: 'active', flagCreate: true
    });
    toast('Demo data reset.');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  // an open listbox closes on any click outside it; whatever was clicked still
  // runs, and normally its own render() picks up the closed state
  let closedPicker = false;
  if (state.form.open && !ev.target.closest('.picker')) {
    state.form.open = null;
    closedPicker = true;
  }
  const flushPicker = () => { if (closedPicker && document.querySelector('.picker-menu')) render(); };
  if (!el) return flushPicker();
  if (el.getAttribute('aria-disabled') === 'true' || el.disabled) return flushPicker();
  const act = el.getAttribute('data-act');
  const fn = ACTIONS[act];
  if (!fn) return flushPicker();
  ev.stopPropagation();
  fn(el.getAttribute('data-arg'), ev);
  flushPicker();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (state.form.open) { state.form.open = null; render(); }
    else if (state.modal) set({ modal: null, form: {} });
    else if (state.menu) set({ menu: null });
  }
  if (ev.key === 'Enter' || ev.key === ' ') {
    const el = ev.target.closest && ev.target.closest('[data-act][role="button"]');
    if (el) { ev.preventDefault(); el.click(); }
  }
});
// text inputs mutate state without re-rendering, so the caret stays put
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-field]');
  if (!el) return;
  const field = el.getAttribute('data-field');
  if (field === 'nextResult') { state.nextResult = el.value; return; }
  if (field === 'last4') el.value = el.value.replace(/\D/g, '').slice(0, 4);
  state.form[field] = el.value;
  if (el.tagName === 'SELECT') render();
});
$('#collapse').addEventListener('click', () => set({ collapsed: !state.collapsed }));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'system') render(); });
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/accounts\/(.+)$/);
  if (m && byId(m[1])) { if (state.detailId !== m[1]) openDetail(m[1]); }
  else if (state.view !== 'list') set({ view: 'list', detailId: null });
});

/* --------------------------------------------------------------- startup -- */
state.theme = localStorage.getItem('loop-proto-theme') || 'system';
renderSidebar();
const initial = location.hash.match(/^#\/accounts\/(.+)$/);
if (initial && byId(initial[1])) { state.view = 'detail'; state.detailId = initial[1]; }
render();
</script>
</body>
</html>
